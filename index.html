<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Friendship Never Ends</title>

<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Prompt',sans-serif;
  background:#0B1F3A;
  color:#FFD700;
  text-align:center;
  overflow-x:hidden;
}

/* ดาวพื้นหลัง */
.stars{
  position:fixed;
  width:100%;
  height:100%;
  top:0;
  left:0;
  z-index:-1;
  background:transparent;
}

.star{
  position:absolute;
  width:2px;
  height:2px;
  background:#FFD700;
  border-radius:50%;
  animation:twinkle 2s infinite ease-in-out;
}

@keyframes twinkle{
  0%,100%{opacity:0.2;}
  50%{opacity:1;}
}

h1{
  margin-top:80px;
  font-size:52px;
  font-weight:700;
}

.subtitle{
  margin-top:10px;
  font-size:18px;
  color:#f5d76e;
}

.about{
  margin:40px 20px;
  font-size:20px;
  line-height:1.8;
}

.button{
  background:#FFD700;
  color:#0B1F3A;
  padding:14px 24px;
  border:none;
  border-radius:10px;
  font-size:16px;
  cursor:pointer;
  margin:10px;
  font-weight:600;
}

.popup{
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.6);
  justify-content:center;
  align-items:center;
}

.popup-content{
  background:#fff;
  width:90%;
  max-width:400px;
  height:80%;
  border-radius:15px;
  overflow:hidden;
  position:relative;
}

.close{
  position:absolute;
  right:10px;
  top:5px;
  cursor:pointer;
  font-size:20px;
  color:#000;
}

.admin-panel{
  display:none;
  margin-top:40px;
  color:#fff;
}

input{
  padding:10px;
  border-radius:8px;
  border:none;
  margin:5px;
}
</style>
</head>

<body>

<div class="stars" id="stars"></div>

<h1>Friendship Never Ends.</h1>
<div class="subtitle">Memories • Moments • Meaning</div>

<div class="about">
สวัสดีครับ ผมเพชรพฤกษาครับ<br>
กำลังจะเรียนมัธยมจบแล้วครับ<br>
มีเรื่องอะไรอยากบอก บอกได้เต็มที่เลย รออ่านอยู่ครับ
</div>

<button class="button" onclick="openForm()">💬 เขียนข้อความถึงเพชร</button>
<button class="button" onclick="showAdmin()">🔒 เข้าดูข้อความลับ</button>

<div class="popup" id="formPopup">
  <div class="popup-content">
    <span class="close" onclick="closeForm()">✖</span>
    <iframe src="https://forms.gle/99vnzu2SYQzP59dK8"
    width="100%" height="100%" frameborder="0"></iframe>
  </div>
</div>

<div class="admin-panel" id="adminPanel">
  <h2>🔐 ใส่รหัสผ่าน</h2>
  <input type="password" id="pass">
  <button class="button" onclick="checkPass()">เข้าสู่ระบบ</button>
</div>

<script>
// เปิดปิดฟอร์ม
function openForm(){
  document.getElementById("formPopup").style.display="flex";
}
function closeForm(){
  document.getElementById("formPopup").style.display="none";
}
function showAdmin(){
  document.getElementById("adminPanel").style.display="block";
}
function checkPass(){
  const p=document.getElementById("pass").value;
  if(p==="7382"){
    window.open("https://docs.google.com/spreadsheets/", "_blank");
  }else{
    alert("รหัสไม่ถูกต้อง");
  }
}

// สร้างดาวแบบสุ่ม
const starsContainer = document.getElementById("stars");
for(let i=0;i<80;i++){
  let star=document.createElement("div");
  star.className="star";
  star.style.top=Math.random()*100+"%";
  star.style.left=Math.random()*100+"%";
  star.style.animationDelay=Math.random()*2+"s";
  starsContainer.appendChild(star);
}
</script>

<!-- เพลง autoplay -->
<iframe width="0" height="0"
src="https://www.youtube.com/embed/HN-T2lmw4QA?autoplay=1&loop=1&playlist=HN-T2lmw4QA"
frameborder="0" allow="autoplay">
</iframe>

</body>
</html>
